name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: x64
            os: windows-latest
            devcmd: amd64
            test: true
            package: true
          # On an ARM64 runner, so the ARM64 build's tests run too
          - preset: arm64
            os: windows-11-arm
            devcmd: arm64
            test: true
            package: false

    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.devcmd }}

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: |
          cmake --build --preset ${{ matrix.preset }}-debug
          cmake --build --preset ${{ matrix.preset }}-release

      - name: Test
        if: matrix.test
        run: |
          ctest --preset ${{ matrix.preset }}-debug
          ctest --preset ${{ matrix.preset }}-release

      # The runner may or may not have Inno Setup already; the script finds it
      # either way.
      - name: Install Inno Setup
        if: matrix.package
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build the installer and zip
        if: matrix.package
        run: cmake --build --preset ${{ matrix.preset }}-release --target installer

      # ARM64 has no installer yet, but the zip is worth having for anyone on an
      # ARM64 machine who wants to try it.
      - name: Build the ARM64 zip
        if: matrix.preset == 'arm64'
        run: >
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\build_installer.ps1
          -BuildDir build\arm64\Release -OutputDir build -Arch arm64 -SkipInstaller

      - uses: actions/upload-artifact@v4
        with:
          name: WinCode-${{ matrix.preset }}
          path: |
            build/WinCode-*-setup.exe
            build/WinCode-*.zip
          if-no-files-found: error

  # A minute of libFuzzer over everything that reads a query
  fuzz:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Build
        run: |
          cmake --preset fuzz
          cmake --build --preset fuzz

      - name: Fuzz
        run: build\fuzz\Release\WinCodeFuzz.exe -max_total_time=60 -max_len=512

  # A tagged commit becomes a release, with the installer and the zips on it.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/WinCode-*-setup.exe
            artifacts/**/WinCode-*.zip
          generate_release_notes: true
